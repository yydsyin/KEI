<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Cuisine &middot; KEI</title>
  <meta name="theme-color" content="#1c1a17">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icones/icone-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/cuisine.css">
</head>
<body class="page-cuisine">

  <!-- ============ CHARGEMENT / ACCES REFUSE ============ -->
  <div class="ecran-cuisine" id="ecran-attente">
    <div class="carte-cuisine">
      <div class="logo-cuisine">Cuisine</div>
      <p class="sous-cuisine" id="sous-cuisine">KEI</p>
      <p class="note-cuisine" id="message-attente">Vérification du compte&hellip;</p>

      <button class="btn-cuisine" id="btn-deconnexion-attente" hidden>
        Se déconnecter
      </button>

      <p style="text-align:center;margin-top:16px">
        <a href="connexion.html" style="color:#8d8579">&larr; Page de connexion</a>
      </p>
    </div>
  </div>

  <!-- ============ LE TABLEAU DE BORD ============ -->
  <div id="tableau-cuisine" hidden>

    <header class="entete-cuisine">
      <div>
        <span class="titre-cuisine">Commandes</span>
        <span class="compteur-attente" id="compteur-attente">0</span>
      </div>
      <div class="actions-entete">
        <span class="compte-cuisine" id="compte-cuisine"></span>
        <button class="btn-icone" id="btn-son" title="Couper le son" aria-label="Couper le son"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
        <button class="btn-icone" id="btn-plein" title="Plein écran" aria-label="Plein écran"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/></svg></button>
        <button class="btn-quitter" id="btn-quitter">Se déconnecter</button>
      </div>
    </header>

    <!-- rappel affiche tant que les notifications ne sont pas autorisees -->
    <div class="bandeau-notif" id="bandeau-notif" hidden>
      <span>Autorisez les notifications pour ne rater aucune commande.</span>
      <button id="btn-autoriser-notif">Autoriser</button>
    </div>

    <main class="liste-commandes" id="liste-commandes" role="log" aria-live="polite" aria-label="Commandes">
      <p class="vide" id="message-vide">
        En attente de commandes&hellip;<br>
        <span>Laissez cette page ouverte pendant le service.</span>
      </p>
    </main>

  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/kei-firebase.js"></script>
  <script src="js/cuisine.js"></script>
</body>
</html>
